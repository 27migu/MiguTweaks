<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Migu TweakingLab | Professional PC Optimization</title>
    <style>
        /* --- HIGH-END DARK ICE BLUE DESIGN SYSTEM --- */
        :root {
            --bg-main: #06080c;       /* Extrem tiefes, edles Dunkelblau/Schwarz */
            --bg-card: #0c1017;       /* Karten-Hintergrund */
            --accent: #5cc2ff;        /* Entspanntes Ice-Blue für Highlights */
            --accent-muted: #1e293b;  /* Gedämpfter Ton für Ränder */
            --text-white: #f8fafc;
            --text-gray: #94a3b8;
            --border: #1e293b;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        body { 
            background-color: var(--bg-main); 
            color: var(--text-white); 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
            line-height: 1.6;
            overflow-x: hidden;
            position: relative;
        }

        /* --- ENTSPANNTER ANIMIERTER BACKGROUND --- */
        .bg-animation {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            background: radial-gradient(circle at 50% 50%, #0c1524 0%, #06080c 100%);
            overflow: hidden;
        }
        .bg-animation::before {
            content: "";
            position: absolute;
            width: 200%;
            height: 200%;
            top: -50%;
            left: -50%;
            background: radial-gradient(circle at 30% 30%, rgba(92, 194, 255, 0.03) 0%, transparent 40%),
                        radial-gradient(circle at 70% 70%, rgba(92, 194, 255, 0.02) 0%, transparent 45%);
            animation: rotateBg 30s linear infinite;
        }
        @keyframes rotateBg {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* --- NAVIGATION (Mit Discord & Twitter Profilbild) --- */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 6%;
            border-bottom: 1px solid var(--border);
            background-color: rgba(6, 8, 12, 0.8);
            backdrop-filter: blur(12px);
            position: sticky;
            top: 0;
            z-index: 100;
        }
        .logo {
            font-size: 1.4rem;
            font-weight: 800;
            letter-spacing: 0.5px;
        }
        .logo span { color: var(--accent); }
        
        .nav-right {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        /* Twitter Profil-Button */
        .twitter-profile-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 44px;
            height: 44px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--accent), #2b6cb0);
            padding: 2px;
            transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            text-decoration: none;
        }
        .twitter-profile-btn:hover {
            transform: scale(1.1) rotate(5deg);
        }
        .twitter-avatar-inner {
            width: 100%;
            height: 100%;
            background: #111;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text-white);
            font-weight: 800;
            font-size: 0.9rem;
        }

        .discord-btn {
            background-color: #5865F2;
            color: var(--text-white);
            padding: 11px 22px;
            border-radius: 6px;
            text-decoration: none;
            font-weight: 700;
            font-size: 0.9rem;
            transition: all 0.2s ease;
        }
        .discord-btn:hover {
            background-color: #4752C4;
            transform: translateY(-1px);
        }

        /* --- HERO SECTION --- */
        .hero {
            max-width: 1000px;
            margin: 0 auto;
            padding: 100px 20px 80px 20px;
            text-align: center;
        }
        .badge {
            background: rgba(92, 194, 255, 0.08);
            color: var(--accent);
            padding: 6px 16px;
            border-radius: 30px;
            font-size: 0.8rem;
            font-weight: 700;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            display: inline-block;
            margin-bottom: 25px;
            border: 1px solid rgba(92, 194, 255, 0.2);
        }
        h1 {
            font-size: 3.5rem;
            font-weight: 800;
            line-height: 1.15;
            margin-bottom: 25px;
            letter-spacing: -0.5px;
        }
        h1 span {
            color: var(--accent);
        }
        .hero p {
            color: var(--text-gray);
            font-size: 1.2rem;
            max-width: 650px;
            margin: 0 auto 40px auto;
        }
        .cta-btn {
            background-color: var(--accent);
            color: #06080c;
            padding: 16px 36px;
            border-radius: 6px;
            text-decoration: none;
            font-weight: 700;
            font-size: 1rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            display: inline-block;
            transition: all 0.2s ease;
        }
        .cta-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 0 20px rgba(92, 194, 255, 0.4);
        }

        /* --- WHAT WE DO (TWEAKS SEKTION) --- */
        .features-section {
            padding: 80px 20px;
            max-width: 1200px;
            margin: 0 auto;
        }
        .section-title {
            text-align: center;
            font-size: 2.2rem;
            font-weight: 800;
            margin-bottom: 10px;
        }
        .section-title span { color: var(--accent); }
        .section-subtitle {
            text-align: center;
            color: var(--text-gray);
            margin-bottom: 50px;
        }
        .feature-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 25px;
        }
        .feature-card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 30px;
            transition: transform 0.2s ease, border-color 0.2s ease;
        }
        .feature-card:hover {
            transform: translateY(-4px);
            border-color: rgba(92, 194, 255, 0.3);
        }
        .feature-icon {
            font-size: 1.8rem;
            color: var(--accent);
            margin-bottom: 15px;
        }
        .feature-card h3 {
            font-size: 1.3rem;
            margin-bottom: 10px;
            font-weight: 700;
        }
        .feature-card p {
            color: var(--text-gray);
            font-size: 0.95rem;
        }

        /* --- VOUCHES SECTION --- */
        .vouches-section {
            padding: 80px 20px;
            border-top: 1px solid var(--border);
        }
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
            gap: 25px;
            max-width: 1200px;
            margin: 0 auto;
        }
        .vouch-card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 25px;
        }
        .vouch-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }
        .user-profile {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .avatar {
            width: 42px;
            height: 42px;
            background: #1e293b;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            color: var(--accent);
        }
        .user-meta {
            display: flex;
            flex-direction: column;
        }
        .user-name { font-weight: 700; font-size: 0.95rem; }
        .user-handle { color: var(--text-gray); font-size: 0.85rem; }
        .x-icon { color: var(--text-gray); font-weight: bold; }
        .vouch-content { color: #e2e8f0; font-size: 1rem; margin-bottom: 15px; }
        .vouch-time { color: #475569; font-size: 0.8rem; }
    </style>
</head>
