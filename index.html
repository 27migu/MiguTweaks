<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Migu TweakingLab | Professional PC Optimization</title>
    <style>
        /* --- DESIGN SYSTEM (80% Deep Black / 20% Ice Blue) --- */
        :root {
            --bg-darkest: #030406;    /* Primärfarbe: Extrem sattes, schonendes Schwarz */
            --bg-card: #090d14;       /* Sekundärfarbe: Edler Boxen-Hintergrund */
            --accent: #5cc2ff;        /* Akzentfarbe: Ice-Blue */
            --accent-glow: rgba(92, 194, 255, 0.15);
            --text-main: #f8fafc;
            --text-muted: #64748b;
            --border: #141b26;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        body { 
            background-color: var(--bg-darkest); 
            color: var(--text-main); 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
            line-height: 1.6;
            overflow-x: hidden;
        }

        /* --- ENTSPANNTE HINTERGRUND-ANIMATION --- */
        .bg-glow {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            background: radial-gradient(circle at 50% -20%, #0d1b2e 0%, var(--bg-darkest) 70%);
            overflow: hidden;
        }
        .bg-glow::after {
            content: "";
            position: absolute;
            width: 150%;
            height: 150%;
            top: -25%;
            left: -25%;
            background: radial-gradient(circle at 20% 30%, rgba(92, 194, 255, 0.02) 0%, transparent 50%),
                        radial-gradient(circle at 80% 70%, rgba(92, 194, 255, 0.02) 0%, transparent 50%);
            animation: drift 25s ease-in-out infinite alternate;
        }
        @keyframes drift {
            0% { transform: translateY(0) rotate(0deg); }
            100% { transform: translateY(40px) rotate(5deg); }
        }

        /* --- HEADER NAVBAR --- */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 6%;
            border-bottom: 1px solid var(--border);
            background-color: rgba(3, 4, 6, 0.8);
            backdrop-filter: blur(12px);
            position: sticky;
            top: 0;
            z-index: 100;
        }
        .logo {
            font-size: 1.3rem;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .logo span { color: var(--accent); }
        
        .discord-btn {
            background-color: #5865F2;
            color: var(--text-main);
            padding: 10px 20px;
            border-radius: 6px;
            text-decoration: none;
            font-weight: 700;
            font-size: 0.9rem;
            transition: all 0.2s ease;
        }
        .discord-btn:hover {
            background-color: #4752C4;
            transform: translateY(-1px);
        }

        /* --- HERO SECTION (VORSTELLUNG) --- */
        .hero-container {
            max-width: 1100px;
            margin: 0 auto;
            padding: 80px 20px;
            display: flex;
            align-items: center;
            gap: 50px;
        }
        
        /* Twitter Profil-Box in der Mitte/Links */
        .profile-card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 25px;
            width: 320px;
            flex-shrink: 0;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
        .profile-avatar {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--accent), #1d4ed8);
            margin: 0 auto 20px auto;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2rem;
            font-weight: 900;
            color: white;
            box-shadow: 0 0 20px var(--accent-glow);
        }
        .profile-card h3 { font-size: 1.4rem; font-weight: 800; margin-bottom: 4px; }
        .profile-card p { color: var(--text-muted); font-size: 0.85rem; margin-bottom: 20px; text-transform: uppercase; letter-spacing: 1px; }
        
        .twitter-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            background-color: #14171a;
            border: 1px solid var(--border);
            color: var(--text-main);
            padding: 10px 16px;
            border-radius: 6px;
            text-decoration: none;
            font-weight: 600;
            font-size: 0.9rem;
            transition: all 0.2s ease;
        }
        .twitter-btn:hover {
            border-color: var(--accent);
            color: var(--accent);
            background-color: rgba(92, 194, 255, 0.05);
        }

        /* Rechte Text-Spalte */
        .hero-text {
            flex-grow: 1;
        }
        .sub-title {
            color: var(--accent);
            font-size: 0.85rem;
            font-weight: 700;
            letter-spacing: 2px;
            text-transform: uppercase;
            margin-bottom: 10px;
        }
        .hero-text h1 {
            font-size: 3.5rem;
            font-weight: 900;
            line-height: 1.1;
            margin-bottom: 20px;
            text-transform: uppercase;
        }
        .hero-text p {
            color: #94a3b8;
            font-size: 1.15rem;
            margin-bottom: 35px;
            max-width: 600px;
        }
        .cta-group {
            display: flex;
            gap: 15px;
        }
        .cta-primary {
            background-color: var(--accent);
            color: var(--bg-darkest);
            padding: 14px 28px;
            border-radius: 6px;
            text-decoration: none;
            font-weight: 700;
            font-size: 0.95rem;
            text-transform: uppercase;
            transition: all 0.2s ease;
        }
        .cta-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(92, 194, 255, 0.4);
        }

        /* --- WAS MACHE ICH SECTION --- */
        .services-section {
            background-color: rgba(9, 13, 20, 0.4);
            border-top: 1px solid var(--border);
            border-bottom: 1px solid var(--border);
            padding: 100px 20px;
        }
        .section-header {
            text-align: center;
            max-width: 600px;
            margin: 0 auto 60px auto;
        }
        .section-header h2 { font-size: 2.2rem; font-weight: 900; text-transform: uppercase; margin-bottom: 10px; }
        .section-header h2 span { color: var(--accent); }
        .section-header p { color: var(--text-muted); }

        .services-grid {
            max-width: 1100px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 25px;
        }
        .service-card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 35px;
            transition: all 0.2s ease;
        }
        .service-card:hover {
            border-color: var(--accent);
            transform: translateY(-3px);
        }
        .service-icon { font-size: 1.8rem; color: var(--accent); margin-bottom: 15px; }
        .service-card h3 { font-size: 1.25rem; font-weight: 700; margin-bottom: 10px; }
        .service-card p { color: #94a3b8; font-size: 0.95rem; }

        /* --- ANKLICKBARE VOUCHES SECTION --- */
        .vouches-section {
            padding: 100px 20px;
            max-width: 1100px;
            margin: 0 auto;
        }
        .vouch-link-wrapper {
            text-decoration: none;
            color: inherit;
            display: block;
            max-width: 550px;
            margin: 0 auto;
        }
        .vouch-card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 30px;
            cursor: pointer;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
        }
        /* Hover-Effekt: Karte leuchtet leicht auf wie bei Profi-Seiten */
        .vouch-card:hover {
            border-color: rgba(92, 194, 255, 0.5);
            box-shadow: 0 10px 30px rgba(92, 194, 255, 0.05);
            transform: scale(1.02);
        }
        .vouch-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }
        .vouch-user {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .vouch-avatar {
            width: 44px;
            height: 44px;
            background: #1e293b;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            color: var(--accent);
        }
        .vouch-meta { display: flex; flex-direction: column; }
        .vouch-name { font-weight: 700; font-size: 1rem; }
        .vouch-handle { color: var(--text-muted); font-size: 0.85rem; }
        .x-logo { color: var(--text-muted); font-size: 1.2rem; font-weight: bold; }
        .vouch-content { font-size: 1.1rem; color: #e2e8f0; margin-bottom: 20px; }
        .vouch-date { color: #475569; font-size: 0.8rem; }

        /* Responsive Anpassungen für Smartphones */
        @media (max-width: 768px) {
            .hero-container { flex-direction: column; text-align: center; padding: 40px 20px; }
            .hero-text h1 { font-size: 2.5rem; }
